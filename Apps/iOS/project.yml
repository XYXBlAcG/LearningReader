name: LearningReader
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: chatgpt.nice114514
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
configFiles:
  Debug: ../../Config/Version.xcconfig
  Release: ../../Config/Version.xcconfig
packages:
  LearningCore:
    path: ../..
targets:
  LearningReader:
    type: application
    platform: iOS
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        NSCameraUsageDescription: 拍摄需要讲解的题目，由你选择的 AI 服务分析图片。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    sources:
      - path: Localization
      - path: UI
      - path: Web
      - path: Study
      - path: AI
      - path: ../Shared
      - path: Assets.xcassets
    dependencies:
      - package: LearningCore
        product: LearningCore
      - package: LearningCore
        product: WebContent
      - package: LearningCore
        product: PracticeCore
      - package: LearningCore
        product: AICore
      - package: LearningCore
        product: StudyLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chatgpt.nice114514.MathLearning
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 知序
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ReaderPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../build/paper-fixtures
        type: folder
    dependencies:
      - target: LearningReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LearningReader:
    build:
      targets:
        LearningReader: all
    test:
      targets:
        - ReaderPDFTests
