name: Clients
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 构建机（macOS 产物始终为 arm64）
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clients:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Course contract
        run: python3 Tools/generate_contract.py --check
      - name: Reader checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node Tools/build_reader_vendor.mjs --check
          node --test Tests/ReaderTests/*.test.cjs
      - name: Core checks
        run: swift test --filter 'CourseTests|GitHubTests|WorkflowTests|HTMLImportTests|WebPageTests|AITests|AITransportTests|AISelectionTests|CourseNavigationTests|StudyRecordTests|StudyLibraryTests'
      - name: Course templates
        run: |
          swift run course validate Templates/minimal-course
          swift run course validate Templates/machine-learning-course
      - name: Build macOS app
        run: python3 Tools/build.py macos
      - name: Real course checks
        run: |
          swift build -c release --product course
          python3 Tools/check_courses.py
      - name: Generate iOS project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          node Tools/prepare_paper_fixture.cjs
          xcodegen generate --spec Apps/iOS/project.yml
      - name: Build iOS app
        run: |
          xcodebuild -project Apps/iOS/LearningReader.xcodeproj -scheme LearningReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/iOS CODE_SIGNING_ALLOWED=NO build > build/ios-build.log 2>&1 || { tail -160 build/ios-build.log; exit 1; }
      - name: PDF renderer checks
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")))')
          test_status=0
          xcodebuild -project Apps/iOS/LearningReader.xcodeproj -scheme LearningReader -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/PDFTests -resultBundlePath build/PDFValidation.xcresult CODE_SIGNING_ALLOWED=NO test -parallel-testing-enabled NO -only-testing:ReaderPDFTests > build/pdf-tests.log 2>&1 || test_status=$?
          xcrun xcresulttool export attachments --path build/PDFValidation.xcresult --output-path build/PrintValidation
          if [ "$test_status" -ne 0 ]; then tail -160 build/pdf-tests.log; exit "$test_status"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PrintValidation
          path: build/PrintValidation
          if-no-files-found: error
      - name: Package
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/iOS/Build/Products/Release-iphoneos/LearningReader.app build/ipa/Payload/
          test -d build/ipa/Payload/LearningReader.app/LearningReader_LearningCore.bundle
          cd build/ipa
          ditto -c -k --keepParent Payload LearningReader-unsigned.ipa
          shasum -a 256 LearningReader-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LearningReader-iOS
          path: |
            build/ipa/LearningReader-unsigned.ipa
            build/ipa/SHA256SUMS.txt
          retention-days: 30
      - name: Package macOS
        run: ditto -c -k --keepParent Output/知序.app build/LearningReader-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LearningReader-macOS-arm64
          path: build/LearningReader-macOS-arm64.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: |
            build/ios-build.log
            build/pdf-tests.log
          if-no-files-found: ignore
